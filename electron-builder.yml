appId: com.blacktriangle.kadr
productName: Kadr
copyright: Copyright © Black Triangle (GPL-3.0)

# asar is intentionally OFF: the app spawns auxiliary processes by absolute
# path — `node electron/mcp-bridge.cjs` (claude.ts) and `python3
# scripts/transcribe.py` (transcribe.ts), both resolved from app.getAppPath().
# Keeping the app unpacked lets those spawns and their require()s resolve
# from node_modules with zero path rewriting.
asar: false

# node-pty is rebuilt for the installed Electron version by the postinstall
# electron-rebuild step, so skip electron-builder's duplicate rebuild.
npmRebuild: false

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - electron/mcp-bridge.cjs
  - electron/kadr-skill.md
  - scripts/transcribe.py
  - scripts/voiceover_worker.py
  - package.json

fileAssociations:
  - ext: kadr
    name: Kadr Project
    description: Kadr video editing project
    role: Editor
    rank: Owner
    icon: icon.icns

mac:
  category: public.app-category.video
  icon: build/icon.icns
  # Local distribution without a Developer ID: explicitly ad-hoc sign the
  # bundle. identity:null would skip signing entirely.
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64

dmg:
  title: Kadr ${version}
