# Все калибруемые величины живут здесь, а не в коде.

[audio]
sr = 16000              # частота для моделей
sr_hf = 32000           # отдельный поток для ВЧ-мер S6
frame_ms = 20           # сетка CTC

[asr]
model = "large-v3"
compute_type = "int8_float16"
device = "cuda"
beam_size = 5
language = "ru"

[anchors]
min_run = 4                 # минимальная длина серии точных совпадений
min_word_prob = 0.6         # порог probability слова ASR внутри якоря
min_long_words = 2          # слов длиной >= 4 символов внутри якоря
min_long_word_chars = 4
min_duration_s = 1.2        # суммарная длительность якоря
max_internal_gap_s = 1.0
fuzzy_match = 0.75          # порог фонетического сходства для "совпадения"
gap_open = 1.2
gap_extend_asr = 0.08       # вставка со стороны ASR (дешевле: рестарты длинные)
gap_extend_script = 0.35    # пропуск со стороны сценария (дороже: реже и важнее)
rate_min_s_per_char = 0.030 # правдоподобный темп русской начитки
rate_max_s_per_char = 0.110
region_max_s = 30.0
region_target_s = 20.0
region_pad_s = 0.25
region_handle_words = 2     # слов якоря, дописываемых в зону как "ручки"
split_max_depth = 4

[ctc]
# gigaam  — GigaAM v3 CTC (Sber, декабрь 2025), русский, ONNX на CPU, кадр 40 мс
# wav2vec2 — jonatasgrosman/wav2vec2-large-xlsr-53-russian (2021), кадр 20 мс
# Две модели, каждая по своей сильной стороне — решение по замеру, а не по
# новизне. wav2vec2 даёт кадр 20 мс, и от него зависит всё, что опирается на
# границы: покрытие, непокрытая речь, длительности. GigaAM v3 вдвое грубее по
# времени (40 мс), но его жадный декод выдаёт связный русский текст там, где
# wav2vec2 даёт «концоле» вместо «консоли», — а от чистоты декода зависит всё,
# что отвечает на вопрос «что именно звучит».
backend = "wav2vec2"        # выравнивание и тайминги
decoder = "gigaam"          # расшифровка услышанного; "" — тот же, что backend
model = "ru"                # ключ whisperx DEFAULT_ALIGN_MODELS_HF
log_p_star = -1.0           # штраф star-токена; ассерт: занятость < 1% на чистом корпусе
